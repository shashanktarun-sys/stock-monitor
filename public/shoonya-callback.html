<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shoonya auth code — Pulse</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e8eef8;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        background: #121a2b;
        border: 1px solid #243049;
        border-radius: 14px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 14px;
        color: #9db0cc;
        line-height: 1.45;
        font-size: 0.92rem;
      }
      .code {
        word-break: break-all;
        background: #0b1220;
        border: 1px solid #314564;
        border-radius: 8px;
        padding: 12px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.88rem;
      }
      .err {
        color: #fca5a5;
      }
      button {
        margin-top: 14px;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .ok {
        color: #86efac;
        font-size: 0.85rem;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Shoonya OAuth callback</h1>
      <p id="msg">Looking for <code>code</code> in the URL…</p>
      <div id="codeBox" class="code hidden"></div>
      <button id="copyBtn" class="hidden" type="button">Copy auth code</button>
      <div id="copied" class="ok hidden">Copied — paste it into Pulse → Connect Shoonya.</div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const code = params.get("code") || params.get("auth_code") || "";
      const msg = document.getElementById("msg");
      const codeBox = document.getElementById("codeBox");
      const copyBtn = document.getElementById("copyBtn");
      const copied = document.getElementById("copied");
      if (!code) {
        msg.className = "err";
        msg.textContent =
          "No code found in this URL. Complete Shoonya authorize again, or paste the full redirect URL into Pulse.";
      } else {
        msg.textContent = "Auth code received. Copy it into Pulse Profile → Shoonya → OAuth auth code.";
        codeBox.textContent = code;
        codeBox.classList.remove("hidden");
        copyBtn.classList.remove("hidden");
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(code);
            copied.classList.remove("hidden");
          } catch {
            codeBox.focus();
            document.execCommand("selectAll");
          }
        };
      }
    </script>
  </body>
</html>
