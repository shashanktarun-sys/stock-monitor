services:
  - type: web
    name: pulse-stock-pal
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: "npm install --omit=dev || true"
    startCommand: "npm start"
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Pulse Stock Pal
      - key: EXECUTION_MODE
        value: paper
      # Attach a Render Postgres DB named pulse-db (or set DATABASE_URL manually / Neon).
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      # Optional auth extras (set in Dashboard):
      # GOOGLE_CLIENT_ID, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM

databases:
  - name: pulse-db
    plan: basic-256mb
    region: singapore
